<!doctype html>
<html lang="fr" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#c8102e">
  <meta name="description" content="Application Touch Unique Studio — projets, commandes du site, contenus IA, publication sociale et boutique automatisée.">
  <title>Touch Unique — Application de gestion</title>
  <link rel="icon" href="ic_launcher_192.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="styles.css?v=9">
</head>
<body>
  <div class="app-bg" aria-hidden="true"><span></span><span></span><span></span></div>

  <div class="app-shell">
    <aside class="sidebar" id="sidebar" aria-label="Navigation de l’application">
      <div class="side-brand">
        <span class="side-mark">TU</span>
        <div><b>TOUCH UNIQUE</b><small>STUDIO · GESTION</small></div>
      </div>
      <button class="side-close" id="side-close" aria-label="Fermer le menu">✕</button>
      <nav id="side-nav"></nav>
      <div class="side-foot">
        <div class="side-status"><span class="status-dot"></span><span>Mode local actif</span></div>
        <small><span id="demo-chip" hidden>DÉMONSTRATION</span></small>
        <a href="https://phelobig.github.io/touchunique-site/" target="_blank" rel="noopener">Voir le site public ↗</a>
      </div>
    </aside>

    <div class="app-main">
      <header class="topbar">
        <button class="top-icon menu-btn" id="menu-btn" aria-label="Ouvrir le menu">☰</button>
        <div class="top-title"><span id="page-kicker">Espace de gestion</span><h1 id="page-title">Tableau de bord</h1></div>
        <div class="top-actions">
          <span class="sync-state" id="sync-state" role="status" aria-live="polite">Synchronisation locale prête</span>
          <button class="top-icon" id="theme-btn" aria-label="Changer de thème" title="Changer de thème">◐</button>
          <button class="top-icon notif-btn" id="notif-btn" aria-label="Notifications">🔔<span class="notif-dot" id="notif-dot" hidden></span></button>
          <button class="btn btn-primary btn-sm" id="new-project">+ Nouveau projet</button>
        </div>
      </header>

      <main class="content" id="content" tabindex="-1"></main>
    </div>
  </div>

  <!-- Assistant flottant -->
  <button class="ai-fab" id="ai-fab" aria-label="Ouvrir l’assistant IA" aria-expanded="false">✺</button>
  <aside class="ai-panel" id="ai-panel" aria-label="Assistant Touch Unique" inert>
    <div class="ai-panel-head">
      <div><b>Assistant Touch Unique</b><small>Analyse locale · hors ligne</small></div>
      <button class="icon-btn" id="ai-close" aria-label="Fermer l’assistant">✕</button>
    </div>
    <div class="ai-messages" id="ai-messages" role="log" aria-live="polite"></div>
    <div class="ai-suggestions" id="ai-suggestions"></div>
    <form class="ai-input" id="ai-form">
      <input id="ai-text" placeholder="Posez une question ou tapez une action…" autocomplete="off">
      <button class="btn btn-primary btn-sm" type="submit">Envoyer</button>
    </form>
  </aside>

  <div class="modal-root" id="modal-root" hidden></div>
  <div class="toast-root" id="toast-root" role="status" aria-live="polite"></div>

  <script src="sync.js?v=9"></script>
  <script src="data.js?v=9"></script>
  <script src="automation.js?v=9"></script>
  <script src="store.js?v=9"></script>
  <script src="app.js?v=9"></script>
</body>
</html>
